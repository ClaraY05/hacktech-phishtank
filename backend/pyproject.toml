[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safe-link-backend"
version = "0.1.0"
description = "Backend scaffold for PhishTank Sandbox orchestration."
readme = "README.md"
# 3.10 to match the Microsoft Playwright Docker base image
# (mcr.microsoft.com/playwright/python:v1.58.0-noble ships Python 3.10).
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "playwright>=1.47.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

# Map our flat src/ layout onto a single distribution package so
# `pip install .` inside the container picks up sandbox.py / worker.py
# / etc. without us having to reorganize into a nested package.
[tool.setuptools]
packages = ["ai_safe_link_backend"]

[tool.setuptools.package-dir]
"ai_safe_link_backend" = "src"
