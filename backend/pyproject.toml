[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safe-link-backend"
version = "0.1.0"
description = "Backend scaffold for AI Safe Link Sandbox orchestration."
readme = "README.md"
# FIX 1: Lowered to 3.10 to match Microsoft's Playwright Docker image
requires-python = ">=3.10" 
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "playwright>=1.47.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

# FIX 2: Map the package name directly to your flat 'src' folder
[tool.setuptools]
packages = ["ai_safe_link_backend"]

[tool.setuptools.package-dir]
"ai_safe_link_backend" = "src"